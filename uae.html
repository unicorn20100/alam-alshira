<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>كوكب الإمارات · معاينة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#06091a;color:#eef2ff;font-family:"Tajawal",system-ui,sans-serif}
  canvas{display:block;touch-action:none}
  .top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px;pointer-events:none;z-index:5}
  .top>*{pointer-events:auto}
  h1{font-size:22px;font-weight:800}h1 small{display:block;font-size:12px;color:#9aa6c4;font-weight:500}
  .btns{display:flex;flex-direction:column;gap:8px}
  .btn{background:rgba(14,20,38,.82);border:1px solid rgba(255,255,255,.14);color:#eef2ff;font:inherit;font-size:14px;padding:9px 13px;border-radius:12px;cursor:pointer;text-decoration:none;text-align:center}
  .btn.on{background:rgba(77,163,255,.25);border-color:#4da3ff}
  .lbl{position:fixed;top:0;left:0;pointer-events:none;white-space:nowrap;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9),0 0 10px rgba(0,0,0,.6);transition:opacity .2s;z-index:3}
  .lbl.em{font-size:17px;letter-spacing:.3px}
  .lbl.city{font-size:12px;font-weight:700;color:#fff6dd}
  .lbl.city::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#ffd23d;margin-left:4px;vertical-align:1px;box-shadow:0 0 6px #ffd23d}
  .lbl.water{font-size:12px;color:#bfe9ff;font-weight:700;font-style:italic}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#06091a;z-index:9;font-size:16px;color:#9aa6c4;transition:opacity .5s}
  .hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-size:13px;color:#9aa6c4;background:rgba(0,0,0,.35);padding:6px 14px;border-radius:20px;white-space:nowrap}
  @media (max-width:640px){ h1{font-size:18px} .btn{font-size:12px;padding:7px 10px} .lbl.em{font-size:14px} .lbl.city{font-size:10px} }
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js",
"three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="load">جاري رسم كوكب الإمارات…</div>
<div class="top">
  <h1>كوكب الإمارات<small>الخريطة ملفوفة على الكرة · معاينة</small></h1>
  <div class="btns">
    <button class="btn on" id="bNames">أسماء الإمارات والمدن</button>
    <button class="btn on" id="bBorders">حدود الإمارات</button>
    <button class="btn on" id="bSpin">تدوير تلقائي</button>
    <button class="btn" id="bSeam">🔁 وريني الفجيرة وأبوظبي</button>
    <button class="btn" id="bExport">⬇️ نزّل المجسم لـ Blender</button>
    <a class="btn" href="./">← الكوكب الحالي</a>
  </div>
</div>
<div id="labels"></div>
<div class="hint">اسحب لتدوير الكوكب · قرّب بإصبعين أو بالعجلة</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { LON0, RAD, toBall, toMap, terrain, height, rnd, buildPlanet, borders, towers, EMIRATES, CITIES, EMIRATE_LABEL_AT, RIVER_AT } from './uae-planet.js?v=6';
import { makeOutline, cloudTexture } from './toon.js?v=6';

/* ---------- scene ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace; document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,500);
const fit=()=>{ const a=innerWidth/innerHeight; camera.position.setLength(a<1?44/Math.max(.6,a)*.62:30); };
camera.position.set(0,8,30); fit();
const controls=new OrbitControls(camera,renderer.domElement); Object.assign(controls,{enableDamping:true,enablePan:false,minDistance:12.5,maxDistance:70,autoRotate:true,autoRotateSpeed:.5,rotateSpeed:.5});
scene.add(new THREE.HemisphereLight(0xeaf4ff,0x34405a,1.25));
const sun=new THREE.DirectionalLight(0xfff2dc,2.3); sun.position.set(20,14,24); scene.add(sun);
// space background with stars
{ const n=1500, p=new Float32Array(n*3); for(let i=0;i<n;i++){ const v=new THREE.Vector3(rnd()-.5,rnd()-.5,rnd()-.5).normalize().multiplyScalar(180+rnd()*120); p.set([v.x,v.y,v.z],i*3); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(p,3)); scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:'#ffffff',size:.7,sizeAttenuation:true}))); }
// soft atmosphere
const atm=new THREE.Mesh(new THREE.SphereGeometry(RAD*1.06,64,48),new THREE.ShaderMaterial({transparent:true,side:THREE.BackSide,depthWrite:false,
  vertexShader:`varying vec3 n;void main(){n=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 n;void main(){float i=pow(.72-dot(n,vec3(0,0,1.)),3.);gl_FragColor=vec4(.45,.75,1.,1.)*i;}`}));
atm.material.userData.outlineParameters={visible:false}; scene.add(atm);

let world=null, bordersMesh=null, cloudGrp=null;
const labels=[];
function addLabel(text,lon,lat,cls,lift=.25){ const el=document.createElement('div'); el.className='lbl '+cls; el.textContent=text; document.getElementById('labels').appendChild(el);
  const d=toBall(lon,lat); labels.push({el,d,p:d.clone().multiplyScalar(RAD+height(d)+lift)}); }

requestAnimationFrame(()=>setTimeout(()=>{
  const {planet,faceEm}=buildPlanet(); world=new THREE.Group(); world.add(planet); scene.add(world);
  bordersMesh=borders(planet,faceEm); world.add(bordersMesh); world.add(towers());
  // clouds drifting around the planet
  cloudGrp=new THREE.Group(); world.add(cloudGrp);
  for(let i=0;i<26;i++){ const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:cloudTexture(i+3),transparent:true,depthWrite:false,opacity:.92}));
    const d=new THREE.Vector3(rnd()-.5,(rnd()-.5)*1.4,rnd()-.5).normalize(); sp.position.copy(d.multiplyScalar(RAD*1.13)); const w=1.6+rnd()*2.4; sp.scale.set(w,w/2,1); cloudGrp.add(sp); }
  // names
  EMIRATES.forEach(e=>{ const [lon,lat]=EMIRATE_LABEL_AT[e.id];
    addLabel(e.name,lon,lat,'em',.45); });
  CITIES.filter(c=>!c.cap||c.name==='العين').concat(CITIES.filter(c=>c.cap)).forEach(c=>addLabel(c.name,c.at[0],c.at[1]+.02,'city',.3));
  addLabel('الخليج العربي',53.4,25.6,'water',.1); addLabel('خليج عُمان',56.42,24.4,'water',.1);
  { const d=toBall(...RIVER_AT); const el=document.createElement('div'); el.className='lbl water'; el.textContent='النهر بين الفجيرة وأبوظبي'; document.getElementById('labels').appendChild(el); labels.push({el,d,p:d.clone().multiplyScalar(RAD+.1)}); }
  outline=makeOutline(renderer);
  window.__uae={world,toBall,toMap,terrain,camera,controls};
  const l=document.getElementById('load'); l.style.opacity=0; setTimeout(()=>l.remove(),500);
  animate();
},30));

let outline, showNames=true;
const proj=new THREE.Vector3(), cam=new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate); controls.update();
  if(cloudGrp) cloudGrp.rotation.y+=.0006;
  cam.copy(camera.position).normalize();
  const dist=camera.position.length();
  for(const L of labels){
    const w=L.d.clone().applyQuaternion(world.quaternion), vis=cam.dot(w);
    const show=showNames&&vis>.3&&(L.el.classList.contains('em')||L.el.classList.contains('water')||dist<34);
    L.el.style.opacity=show?Math.min(1,(vis-.3)*5):0; if(!show) continue;
    proj.copy(L.p).applyMatrix4(world.matrixWorld).project(camera);
    L.el.style.transform=`translate(${(proj.x*.5+.5)*innerWidth}px,${(-proj.y*.5+.5)*innerHeight}px) translate(-50%,-50%)`;
  }
  outline.render(scene,camera);
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

/* ---------- buttons ---------- */
const tog=(b,f)=>{ b.onclick=()=>{ b.classList.toggle('on'); f(b.classList.contains('on')); }; };
tog(bNames,on=>showNames=on);
tog(bBorders,on=>bordersMesh.visible=on);
tog(bSpin,on=>controls.autoRotate=on);
controls.addEventListener('start',()=>{ controls.autoRotate=false; bSpin.classList.remove('on'); });
bSeam.onclick=()=>{ // fly to the back of the ball where Fujairah meets Abu Dhabi's west across the river
  controls.autoRotate=false; bSpin.classList.remove('on');
  const d=toBall(...RIVER_AT).applyQuaternion(world.quaternion); const L=camera.position.length();
  const from=camera.position.clone(), to=d.multiplyScalar(Math.min(L,24)); let t=0;
  const step=()=>{ t=Math.min(1,t+.025); const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2; camera.position.lerpVectors(from,to,e).setLength(THREE.MathUtils.lerp(from.length(),to.length(),e)); camera.lookAt(0,0,0); if(t<1) requestAnimationFrame(step); };
  step();
};
bExport.onclick=()=>{
  // export with standard materials so Blender reads the colours
  const copy=world.clone(true);
  copy.traverse(o=>{ if(o.isMesh&&o.material?.isMeshToonMaterial) o.material=new THREE.MeshStandardMaterial({vertexColors:o.material.vertexColors,color:o.material.color,roughness:.9}); });
  copy.remove(...copy.children.filter(o=>o.type==='Group'&&o.children[0]?.isSprite));
  new GLTFExporter().parse(copy,buf=>{
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([buf],{type:'model/gltf-binary'})); a.download='uae-planet.glb'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  },e=>alert('ما قدرنا نصدّر المجسم'),{binary:true});
};
</script>
</body>
</html>
