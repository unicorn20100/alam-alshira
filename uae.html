<body>

    <button class="btn on" id="bNames">أسماء الإمارات والمدن</button>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { MAINLAND, ISLANDS, CREEKS, EMIRATES, CITIES, coast, emirateAt } from './uae-map.js?v=5';
import { toonGradient, makeOutline, cloudTexture } from './toon.js?v=5';

/* ---------- how the map wraps on the ball ----------
   Longitude goes all the way around (west edge of Abu Dhabi meets Fujairah on the back, with a river between).
   Latitude goes up/down; above the northern coast is the Gulf, below the borders is open sea. */
const LON0=51.56, LON1=56.40;            // map edges: Abu Dhabi's west border … Fujairah's coast
// tilt: as the map goes east it is lowered a little, so Fujairah ends up exactly opposite Abu Dhabi's west end
const K=.24, tilt=(lon,lat)=>lat-K*(lon-LON0);
const LAT0=21.2, LAT1=25.6;               // range of the tilted latitude (sea above and below the land)
const RIVER=2.2;                          // degrees of the ball kept for the river at the seam
const BAND=62;                           // map spans latitude −62°…+62° on the ball; beyond that is polar sea
const RAD=10;
const D2R=Math.PI/180;
const toBall=(lon,lat)=>{                // map → unit vector on the ball
  const th=((lon-LON0)/(LON1-LON0)-.5)*(360-RIVER)*D2R, ph=((tilt(lon,lat)-LAT0)/(LAT1-LAT0)*2-1)*BAND*D2R;
  return new THREE.Vector3(Math.cos(ph)*Math.sin(th),Math.sin(ph),Math.cos(ph)*Math.cos(th));
};
const toMap=v=>{                          // unit vector → map (or null in the seam river / polar sea)
  const th=Math.atan2(v.x,v.z)/D2R, ph=Math.asin(Math.max(-1,Math.min(1,v.y)))/D2R;
  const u=th/(360-RIVER)+.5, w=(ph/BAND+1)/2;
  const lon=LON0+u*(LON1-LON0);
  return {lon, lat:LAT0+w*(LAT1-LAT0)+K*(lon-LON0), seam:Math.abs(th)>(360-RIVER)/2, polar:Math.abs(ph)>BAND};
};

const RIVER_Y=[toBall(LON0,23.75).y,toBall(LON0,24.45).y];   // latitude band of the river on the ball

/* ---------- noise ---------- */
let seed=2971; const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
const P=new Uint8Array(512); {const p=[...Array(256).keys()]; for(let i=255;i>0;i--){const j=Math.floor(rnd()*(i+1));[p[i],p[j]]=[p[j],p[i]];} for(let i=0;i<512;i++)P[i]=p[i&255];}
const fade=t=>t*t*(3-2*t), hsh=(x,y,z)=>P[(P[(P[x&255]+y)&255]+z)&255]/255;
function vnoise(x,y,z){const X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z),fx=fade(x-X),fy=fade(y-Y),fz=fade(z-Z),L=(a,b,t)=>a+(b-a)*t;
  return L(L(L(hsh(X,Y,Z),hsh(X+1,Y,Z),fx),L(hsh(X,Y+1,Z),hsh(X+1,Y+1,Z),fx),fy),L(L(hsh(X,Y,Z+1),hsh(X+1,Y,Z+1),fx),L(hsh(X,Y+1,Z+1),hsh(X+1,Y+1,Z+1),fx),fy),fz);}
const fbm=(v,f,o=4)=>{let a=0,s=.5,t=0;for(let i=0;i<o;i++){a+=s*vnoise(v.x*f+31,v.y*f+17,v.z*f+5);t+=s;s*=.5;f*=2;}return a/t;};

/* ---------- what is at a place (real UAE geography) ---------- */
const near=(lon,lat,x,y,r)=>Math.hypot((lon-x)*.91,lat-y)<r;
function terrain(v){
  const m=toMap(v);
  if(m.seam){ // the river only between the two coasts; elsewhere the seam is ordinary sea
    const y=v.y; if(y>RIVER_Y[0]&&y<RIVER_Y[1]) return {water:true,river:true,d:-.02};
    const tl=(Math.asin(Math.max(-1,Math.min(1,y)))/D2R/BAND+1)/2*(LAT1-LAT0)+LAT0;     // same depth as the sea on both sides
    const dA=coast(LON0,tl).d, dB=coast(LON1,tl+K*(LON1-LON0)).d;
    return {water:true,d:Math.min(-.03,(Math.min(0,dA)+Math.min(0,dB))/2)};
  }
  if(m.polar) return {water:true,d:-1};
  const c=coast(m.lon,m.lat), {lon,lat}=m;
  if(!c.land) return {water:true,d:c.d,lon,lat};
  const t={water:false,d:c.d,lon,lat,em:emirateAt(lon,lat),island:c.island};
  // Hajar mountains (RAK + Fujairah + Hatta), and Jebel Hafeet by Al Ain
  const hajar=lon>55.88&&lat>24.72&&lat<26.02&&c.d>.03;
  const hafeet=near(lon,lat,55.78,24.07,.07);
  if(hajar||hafeet) t.mountain=Math.min(1,(c.d-.02)*9)*(hafeet?1-Math.hypot((lon-55.78)*.91,lat-24.07)/.07:1);
  // Liwa / Rub' al Khali red dunes in the south
  else if(lat<23.75&&lon>52.4) t.dunes=Math.min(1,(23.75-lat)*2.5);
  // salt flats (sabkha) along the western coast
  else if(lon<54.0&&c.d<.16&&lat<24.25) t.sabkha=true;
  if(near(lon,lat,55.74,24.22,.05)||(lat>23.05&&lat<23.2&&lon>53.4&&lon<54.3&&fbm(v,60)>.55)) t.oasis=true;     // Al Ain + Liwa palms
  if(c.d<.035&&near(lon,lat,54.45,24.42,.12)) t.mangrove=true;                                              // Abu Dhabi mangroves
  for(const ct of CITIES) if(near(lon,lat,ct.at[0],ct.at[1],.035+.035*ct.size)) t.city=ct;
  return t;
}
function height(v){
  const t=terrain(v);
  if(t.water) return t.river?-.05:Math.max(-.12,t.d*.6);
  let h=.03+Math.min(.04,t.d*.4);
  if(t.mountain) h+=t.mountain*(.14+.3*fbm(v,14,3));
  if(t.dunes) h+=t.dunes*.05*Math.abs(Math.sin(fbm(v,40)*30));
  return h;
}

/* ---------- build ---------- */
const C=new THREE.Color();
const COL={deep:'#1c5fb8',mid:'#2b8fd8',shallow:'#47c9d6',lagoon:'#7fe3d6',river:'#3fb8e0',polar:'#1a4c9a',
  beach:'#f6e6b8',sand:'#ecd29c',gravel:'#dcc08a',dune1:'#e9a15e',dune2:'#d9853f',sabkha:'#f3efe3',
  rock1:'#c39a72',rock2:'#a9825f',peak:'#e0c49e',oasis:'#4f9a4a',mangrove:'#3f8a4e',city:'#d8d2c6',city2:'#c8bfb0'};
const col=k=>new THREE.Color(COL[k]);

function build(){
  const geo=new THREE.IcosahedronGeometry(1,96); const pos=geo.attributes.position, n=pos.count;
  const v=new THREE.Vector3(), cache=new Map();
  // displace every vertex by the terrain height (same position → same height, so no cracks)
  for(let i=0;i<n;i++){
    v.fromBufferAttribute(pos,i).normalize(); const k=v.x.toFixed(5)+','+v.y.toFixed(5)+','+v.z.toFixed(5);
    let h=cache.get(k); if(h===undefined){ h=height(v); cache.set(k,h); }
    pos.setXYZ(i,v.x*(RAD+h),v.y*(RAD+h),v.z*(RAD+h));
  }
  // colour every triangle by what is at its centre
  const colors=new Float32Array(n*3), a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3();
  const faceEm=new Int8Array(n/3);
  for(let f=0;f<n/3;f++){
    a.fromBufferAttribute(pos,f*3); b.fromBufferAttribute(pos,f*3+1); c.fromBufferAttribute(pos,f*3+2);
    v.copy(a).add(b).add(c).normalize(); const t=terrain(v), j=fbm(v,90,2);
    faceEm[f]=t.water?-1:t.em;
    if(t.water){
      if(t.river) C.copy(col('river'));
      else if(t.d<=-1) C.copy(col('polar'));
      else if(t.d>-.03) C.copy(col('lagoon'));
      else if(t.d>-.12) C.copy(col('shallow'));
      else if(t.d>-.45) C.copy(col('mid')).lerp(col('deep'),(-t.d-.12)/.33);
      else C.copy(col('deep')).lerp(col('polar'),Math.min(1,(-t.d-.45)/1.2));
      C.offsetHSL(0,0,(j-.5)*.03);
    } else {
      if(t.city) C.copy(j>.5?col('city'):col('city2'));
      else if(t.mangrove) C.copy(col('mangrove'));
      else if(t.oasis) C.copy(col('oasis')).offsetHSL(0,0,(j-.5)*.1);
      else if(t.mountain){ const r=fbm(v,26,2); C.copy(col(t.mountain>.7&&r>.58?'peak':r>.47?'rock1':'rock2')); }
      else if(t.d<.012) C.copy(col('beach'));
      else if(t.sabkha) C.copy(col('sabkha')).lerp(col('sand'),j*.4);
      else if(t.dunes) C.copy(col('sand')).lerp(col(j>.5?'dune1':'dune2'),t.dunes);
      else C.copy(col('sand')).lerp(col('gravel'),fbm(v,30,3));
      C.offsetHSL(0,0,(j-.5)*.04);
    }
    for(let k=0;k<3;k++){ colors[(f*3+k)*3]=C.r; colors[(f*3+k)*3+1]=C.g; colors[(f*3+k)*3+2]=C.b; }
  }
  geo.setAttribute('color',new THREE.BufferAttribute(colors,3)); geo.computeVertexNormals();
  const g4=new THREE.DataTexture(new Uint8Array([150,150,150,255, 195,195,195,255, 232,232,232,255, 255,255,255,255]),4,1,THREE.RGBAFormat);
  g4.minFilter=g4.magFilter=THREE.NearestFilter; g4.needsUpdate=true;
  const planet=new THREE.Mesh(geo,new THREE.MeshToonMaterial({vertexColors:true,gradientMap:g4}));
  planet.material.userData.outlineParameters={thickness:.0025,color:[.08,.1,.2]};
  return {planet,faceEm};
}

/* emirate borders: thin raised lines along edges between different emirates */
function borders(planet,faceEm){
  const pos=planet.geometry.attributes.position, edge=new Map(), key=(p,q)=>{const s=[p,q].map(i=>[pos.getX(i),pos.getY(i),pos.getZ(i)].map(x=>x.toFixed(4)).join(','));return s.sort().join('|');};
  for(let f=0;f<faceEm.length;f++) for(let e=0;e<3;e++){ const i=f*3+e, j=f*3+(e+1)%3, k=key(i,j);
    const o=edge.get(k); if(o===undefined) edge.set(k,[f,i,j]); else if(faceEm[o[0]]>=0&&faceEm[f]>=0&&faceEm[o[0]]!==faceEm[f]) o.push('b'); }
  const pts=[]; for(const [k,o] of edge) if(o[3]==='b'){ for(const i of [o[1],o[2]]){ const p=new THREE.Vector3().fromBufferAttribute(pos,i); p.multiplyScalar(1.0025); pts.push(p.x,p.y,p.z); } }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  return new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:'#5b3a1e',transparent:true,opacity:.7}));
}

/* city towers (Burj Khalifa included) */
function towers(){
  const grp=new THREE.Group(), box=new THREE.BoxGeometry(1,1,1).translate(0,.5,0);
  const tot=CITIES.reduce((a,c)=>a+c.towers,0)+1;
  const im=new THREE.InstancedMesh(box,new THREE.MeshToonMaterial({gradientMap:toonGradient()}),tot);
  im.material.userData.outlineParameters={visible:false};
  const m=new THREE.Matrix4(), q=new THREE.Quaternion(), up=new THREE.Vector3(0,1,0), s=new THREE.Vector3(), c=new THREE.Color();
  const TC=['#f4f4ef','#cfe3f5','#9cc6e8','#e9d8b8','#ffffff','#b9d2ea'];
  let k=0;
  const place=(lon,lat,w,h,color)=>{ const d=toBall(lon,lat); const t=terrain(d); if(t.water) return;
    const p=d.clone().multiplyScalar(RAD+height(d)-.01); q.setFromUnitVectors(up,d); s.set(w,h,w); m.compose(p,q,s); im.setMatrixAt(k,m); im.setColorAt(k,c.set(color)); k++; };
  for(const ct of CITIES){ const r=.025+.03*ct.size;
    for(let i=0;i<ct.towers;i++){ const a=rnd()*Math.PI*2, rr=Math.sqrt(rnd())*r;
      place(ct.at[0]+Math.cos(a)*rr/.91,ct.at[1]+Math.sin(a)*rr,.05+rnd()*.05,(ct.cap?.08:.05)+rnd()*(.12+ct.size*.22)*(1-rr/r*.6),TC[Math.floor(rnd()*TC.length)]); }
    if(ct.tallest) place(ct.tallest[0],ct.tallest[1],.06,.95,'#dfe8f2');
  }
  im.count=k; grp.add(im); return grp;
}

/* ---------- scene ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace; document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,500);
const fit=()=>{ const a=innerWidth/innerHeight; camera.position.setLength(a<1?44/Math.max(.6,a)*.62:30); };
camera.position.set(0,8,30); fit();
const controls=new OrbitControls(camera,renderer.domElement); Object.assign(controls,{enableDamping:true,enablePan:false,minDistance:12.5,maxDistance:70,autoRotate:true,autoRotateSpeed:.5,rotateSpeed:.5});
scene.add(new THREE.HemisphereLight(0xeaf4ff,0x34405a,1.25));
const sun=new THREE.DirectionalLight(0xfff2dc,2.3); sun.position.set(20,14,24); scene.add(sun);
// space background with stars
{ const n=1500, p=new Float32Array(n*3); for(let i=0;i<n;i++){ const v=new THREE.Vector3(rnd()-.5,rnd()-.5,rnd()-.5).normalize().multiplyScalar(180+rnd()*120); p.set([v.x,v.y,v.z],i*3); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(p,3)); scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:'#ffffff',size:.7,sizeAttenuation:true}))); }
// soft atmosphere
const atm=new THREE.Mesh(new THREE.SphereGeometry(RAD*1.06,64,48),new THREE.ShaderMaterial({transparent:true,side:THREE.BackSide,depthWrite:false,
  vertexShader:`varying vec3 n;void main(){n=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 n;void main(){float i=pow(.72-dot(n,vec3(0,0,1.)),3.);gl_FragColor=vec4(.45,.75,1.,1.)*i;}`}));
atm.material.userData.outlineParameters={visible:false}; scene.add(atm);

let world=null, bordersMesh=null, cloudGrp=null;
const labels=[];
function addLabel(text,lon,lat,cls,lift=.25){ const el=document.createElement('div'); el.className='lbl '+cls; el.textContent=text; document.getElementById('labels').appendChild(el);
  const d=toBall(lon,lat); labels.push({el,d,p:d.clone().multiplyScalar(RAD+height(d)+lift)}); }

requestAnimationFrame(()=>setTimeout(()=>{
  const {planet,faceEm}=build(); world=new THREE.Group(); world.add(planet); scene.add(world);
  bordersMesh=borders(planet,faceEm); world.add(bordersMesh); world.add(towers());
  // clouds drifting around the planet
  cloudGrp=new THREE.Group(); world.add(cloudGrp);
  for(let i=0;i<26;i++){ const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:cloudTexture(i+3),transparent:true,depthWrite:false,opacity:.92}));
    const d=new THREE.Vector3(rnd()-.5,(rnd()-.5)*1.4,rnd()-.5).normalize(); sp.position.copy(d.multiplyScalar(RAD*1.13)); const w=1.6+rnd()*2.4; sp.scale.set(w,w/2,1); cloudGrp.add(sp); }
  // names
  EMIRATES.forEach(e=>{ const [lon,lat]=e.id==='ad'?[53.6,23.55]:e.id==='dxb'?[55.33,24.95]:e.id==='shj'?[55.72,25.22]:e.id==='ajm'?[55.5,25.43]:e.id==='uaq'?[55.68,25.5]:e.id==='rak'?[55.98,25.68]:[56.27,25.32];
    addLabel(e.name,lon,lat,'em',.45); });
  CITIES.filter(c=>!c.cap||c.name==='العين').concat(CITIES.filter(c=>c.cap)).forEach(c=>addLabel(c.name,c.at[0],c.at[1]+.02,'city',.3));
  addLabel('الخليج العربي',53.4,25.6,'water',.1); addLabel('خليج عُمان',56.42,24.4,'water',.1);
  { const d=toBall(LON0-.01,24.05); const el=document.createElement('div'); el.className='lbl water'; el.textContent='النهر بين الفجيرة وأبوظبي'; document.getElementById('labels').appendChild(el); labels.push({el,d,p:d.clone().multiplyScalar(RAD+.1)}); }
  outline=makeOutline(renderer);
  window.__uae={world,toBall,toMap,terrain,camera,controls};
  const l=document.getElementById('load'); l.style.opacity=0; setTimeout(()=>l.remove(),500);
  animate();
},30));

let outline, showNames=true;
const proj=new THREE.Vector3(), cam=new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate); controls.update();
  if(cloudGrp) cloudGrp.rotation.y+=.0006;
  cam.copy(camera.position).normalize();
  const dist=camera.position.length();
  for(const L of labels){
    const w=L.d.clone().applyQuaternion(world.quaternion), vis=cam.dot(w);
    const show=showNames&&vis>.3&&(L.el.classList.contains('em')||L.el.classList.contains('water')||dist<34);
    L.el.style.opacity=show?Math.min(1,(vis-.3)*5):0; if(!show) continue;
    proj.copy(L.p).applyMatrix4(world.matrixWorld).project(camera);
    L.el.style.transform=`translate(${(proj.x*.5+.5)*innerWidth}px,${(-proj.y*.5+.5)*innerHeight}px) translate(-50%,-50%)`;
  }
  outline.render(scene,camera);
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

/* ---------- buttons ---------- */
const tog=(b,f)=>{ b.onclick=()=>{ b.classList.toggle('on'); f(b.classList.contains('on')); }; };
tog(bNames,on=>showNames=on);
tog(bBorders,on=>bordersMesh.visible=on);
tog(bSpin,on=>controls.autoRotate=on);
controls.addEventListener('start',()=>{ controls.autoRotate=false; bSpin.classList.remove('on'); });
bSeam.onclick=()=>{ // fly to the back of the ball where Fujairah meets Abu Dhabi's west across the river
  controls.autoRotate=false; bSpin.classList.remove('on');
  const d=toBall(LON0-.01,24.05).applyQuaternion(world.quaternion); const L=camera.position.length();
  const from=camera.position.clone(), to=d.multiplyScalar(Math.min(L,24)); let t=0;
  const step=()=>{ t=Math.min(1,t+.025); const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2; camera.position.lerpVectors(from,to,e).setLength(THREE.MathUtils.lerp(from.length(),to.length(),e)); camera.lookAt(0,0,0); if(t<1) requestAnimationFrame(step); };
  step();
};
bExport.onclick=()=>{
  // export with standard materials so Blender reads the colours
  const copy=world.clone(true);
  copy.traverse(o=>{ if(o.isMesh&&o.material?.isMeshToonMaterial) o.material=new THREE.MeshStandardMaterial({vertexColors:o.material.vertexColors,color:o.material.color,roughness:.9}); });
  copy.remove(...copy.children.filter(o=>o.type==='Group'&&o.children[0]?.isSprite));
  new GLTFExporter().parse(copy,buf=>{
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([buf],{type:'model/gltf-binary'})); a.download='uae-planet.glb'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  },e=>alert('ما قدرنا نصدّر المجسم'),{binary:true});
};
</script>
